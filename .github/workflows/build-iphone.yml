name: Build iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore the reviewed app source
        run: |
          python3 - <<'PYCODE'
          import zipfile
          from pathlib import PurePosixPath
          with zipfile.ZipFile('MiaoJi-remote-source.zip') as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
              archive.extractall('RemoteSource')
          PYCODE
      - name: Build device app and package unsigned IPA
        run: bash RemoteSource/Scripts/build-iphone.sh
      - name: Upload IPA for local re-signing
        uses: actions/upload-artifact@v7
        with:
          name: MiaoJi-iPhone-unsigned
          path: |
            RemoteSource/Build/iPhone/Output/MiaoJi-unsigned.ipa
            RemoteSource/Build/iPhone/Output/MiaoJi-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Check iPhone layout in Simulator
        run: bash RemoteSource/Scripts/check-iphone-layout.sh
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiaoJi-build-log
          path: |
            RemoteSource/Build/iPhone/build.log
            RemoteSource/Build/iPhone/simulator.log
            RemoteSource/Build/iPhone/iPhone-home.png
          if-no-files-found: ignore
          retention-days: 7
