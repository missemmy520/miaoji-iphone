name: Build iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore the reviewed app source
        env:
          MIAOJI_SOURCE_BASE64: >-
            
        run: |
          python3 - <<'PYCODE'
          import base64, io, os, zipfile
          from pathlib import PurePosixPath
          data = base64.b64decode(os.environ['MIAOJI_SOURCE_BASE64'], validate=True)
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in name
              archive.extractall('RemoteSource')
          PYCODE
      - name: Build device app and package unsigned IPA
        run: bash RemoteSource/Scripts/build-iphone.sh
      - name: Upload IPA for local re-signing
        uses: actions/upload-artifact@v7
        with:
          name: MiaoJi-iPhone-unsigned
          path: |
            RemoteSource/Build/iPhone/Output/MiaoJi-unsigned.ipa
            RemoteSource/Build/iPhone/Output/MiaoJi-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiaoJi-build-log
          path: RemoteSource/Build/iPhone/build.log
          if-no-files-found: ignore
          retention-days: 7
